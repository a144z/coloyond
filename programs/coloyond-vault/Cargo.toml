[package]
name = "coloyond-vault"
version = "1.0.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
name = "coloyond_vault"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []
[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token"] }
coloyond-etf-oracle = { path = "../../crates/etf-oracle" }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
