[package]
name = "coloyond-vault"
version = "0.3.0"
description = "Coloyond pooled two-asset vault program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "coloyond_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token"] }
pyth-solana-receiver-sdk = "=1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[[test]]
name = "oracle"
path = "tests/oracle/mod.rs"
