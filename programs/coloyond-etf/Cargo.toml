[package]
name = "coloyond-etf"
version = "0.1.0"
description = "Coloyond ETF AMM v1 (draft, risk-increasing paths fail closed)"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "coloyond_etf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token"] }
coloyond-etf-identity = { path = "../../crates/etf-identity" }
coloyond-etf-math = { path = "../../crates/etf-math" }
coloyond-etf-oracle = { path = "../../crates/etf-oracle" }
pyth-solana-receiver-sdk = "=1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
