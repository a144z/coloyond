[package]
name = "coloyond-portfolio"
version = "0.1.0"
description = "Coloyond personal-vault v2 program (issue #38 scaffold, V1 create/fund/exit slice)"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "coloyond_portfolio"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token"] }
etf-oracle = { package = "coloyond-etf-oracle", path = "../../crates/etf-oracle" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
