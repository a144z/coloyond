[package]
name = "mb-smoke"
version = "0.1.0"
edition = "2021"
description = "Throwaway MagicBlock smoke test for issue #38 (S1-S3)"

[lib]
crate-type = ["cdylib", "lib"]
name = "mb_smoke"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "crank"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
